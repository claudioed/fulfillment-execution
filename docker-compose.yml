services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fulfillment
      POSTGRES_PASSWORD: fulfillment
      POSTGRES_DB: fulfillment_execution
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillment"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

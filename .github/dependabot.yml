# Dependency-drift sensor. Keeps the Go module graph and the pinned GitHub
# Actions / go-version from silently ageing into known-vulnerable territory
# between govulncheck runs.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "gomod"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    groups:
      # One PR per week for the low-risk bumps; majors still come separately
      # so they get a human read.
      go-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 6am UTC, for the mutation job only
  workflow_dispatch: {}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fulfillment
          POSTGRES_PASSWORD: fulfillment
          POSTGRES_DB: fulfillment_execution
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1
      - name: Unit tests + coverage gate
        run: |
          go test ./internal/domain/... ./internal/application/... -coverprofile=coverage.out -race
          go tool cover -func=coverage.out | tail -1
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { exit (cov < 90) }'
      - name: Full test suite (build/vet/race, all packages)
        run: |
          go build ./...
          go vet ./...
          go test ./... -race
      - name: Integration tests
        env:
          DATABASE_URL: "postgres://fulfillment:fulfillment@localhost:5432/fulfillment_execution?sslmode=disable"
        run: go test -tags=integration ./... -v

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli
      - name: Lint OpenAPI spec
        run: spectral lint openapi.yaml --ruleset .spectral.yaml --fail-severity=warn

  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
      - name: Mutation testing (domain layer)
        run: gremlins unleash ./internal/domain/...

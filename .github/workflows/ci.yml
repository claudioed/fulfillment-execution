name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 6am UTC, for the mutation job only
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false          # golangci-lint-action manages its own cache
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and vet
        run: |
          set -euo pipefail
          go build ./...
          go vet ./...

      - name: Unit tests with coverage
        run: |
          set -euo pipefail
          go test ./... -race \
            -coverprofile=coverage.out \
            -coverpkg=./internal/domain/...,./internal/application/...

      - name: Coverage gate
        env:
          THRESHOLD: "90"
        run: |
          set -euo pipefail
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "### Coverage: ${COVERAGE}% (gate: ${THRESHOLD}%)" >> "$GITHUB_STEP_SUMMARY"
          if awk -v c="$COVERAGE" -v t="$THRESHOLD" 'BEGIN { exit !(c < t) }'; then
            echo "::error::coverage ${COVERAGE}% is below the ${THRESHOLD}% gate"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out

  bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run BDD (godog/Gherkin) acceptance tests
        run: go test ./... -run TestFeatures -v

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fulfillment
          POSTGRES_PASSWORD: fulfillment
          POSTGRES_DB: fulfillment_execution
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration tests
        env:
          DATABASE_URL: "postgres://fulfillment:fulfillment@localhost:5432/fulfillment_execution?sslmode=disable"
        run: go test -tags=integration ./... -race -count=1

  # Fast, BLOCKING test-quality sensor: runs on every push/PR.
  # Subset picked by measurement — ./internal/domain/task holds 15 of the
  # domain layer's 31 mutants (the largest of any single package) and covers
  # the claim / lease / at-most-once lifecycle, this context's behavioural
  # core. Measured locally: 15 killed, 0 lived, efficacy 100.00% in ~1 min.
  # Thresholds come from .gremlins.yaml, so a drop in mutation score fails
  # the build rather than just printing a number.
  mutation-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Mutation testing (fast subset — task aggregate)
        run: gremlins unleash ./internal/domain/task

  # Supply-chain sensor: known CVEs in the dependency graph and in the Go
  # stdlib version this module builds against.
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Mutation testing (domain layer)
        run: gremlins unleash ./internal/domain --workers 1 --timeout-coefficient 30

  api-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli
      - name: Lint OpenAPI spec
        run: spectral lint apis/openapi.yaml --ruleset .spectral.yaml --fail-severity=warn
      - name: Lint AsyncAPI spec
        run: spectral lint apis/asyncapi.yaml --ruleset .spectral.asyncapi.yaml --fail-severity=warn

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          check-latest: true
      - uses: helm/chart-testing-action@v2.8.0
      - name: Run chart-testing (lint)
        run: ct lint --charts charts/fulfillment-execution --validate-maintainers=false --check-version-increment=false

  arch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Architecture fitness tests
        run: go test ./internal/architecture/... -v

  docker-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test, bdd, integration, mutation-fast, vuln, api-lint, helm-lint, arch-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set image tag (short SHA)
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            claudioed/fulfillment-execution:latest
            claudioed/fulfillment-execution:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Cuts a GitHub Release (+ matching git tag + versioned Docker tag) on every
  # merge to main. Runs only after docker-publish actually succeeded, so a
  # release always points at an image that is genuinely live on Docker Hub.
  # Versioning: simple auto-increment patch (vX.Y.Z -> vX.Y.(Z+1)), starting
  # at v0.1.0 if no tag exists yet. No commit-message parsing.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute next version
        id: version
        run: |
          git fetch origin --tags --force
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            new="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            patch=$((patch + 1))
            new="v${major}.${minor}.${patch}"
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
      - name: Set image tag (short SHA)
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag the already-published image with the release version
        run: |
          docker buildx imagetools create \
            -t claudioed/fulfillment-execution:${{ steps.version.outputs.version }} \
            claudioed/fulfillment-execution:${{ env.SHORT_SHA }}
      - name: Create and push the git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            Docker image: `claudioed/fulfillment-execution:${{ steps.version.outputs.version }}`
            (also tagged `latest` and `${{ env.SHORT_SHA }}`)

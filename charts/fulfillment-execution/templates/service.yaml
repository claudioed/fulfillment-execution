apiVersion: v1
kind: Service
metadata:
  name: {{ include "fulfillment-execution.fullname" . }}
  labels:
    {{- include "fulfillment-execution.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "fulfillment-execution.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api

{{- /*
REST identity Secret (ADR-0021). Created only when at least one key is
supplied and no existingSecret is named; each data key is rendered only when
non-empty so an unset key is genuinely absent (the binary ignores blanks
anyway, but a Secret should not carry empty credentials).
*/ -}}
{{- if and (not .Values.auth.existingSecret) (or .Values.auth.readKey .Values.auth.readWriteKey .Values.inventoryStorage.apiKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fulfillment-execution.authSecretName" . }}
  labels:
    {{- include "fulfillment-execution.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.auth.readKey }}
  API_READ_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.readWriteKey }}
  API_READWRITE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.inventoryStorage.apiKey }}
  INVENTORY_STORAGE_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}

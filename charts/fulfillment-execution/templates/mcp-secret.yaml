{{- if and .Values.mcp.enabled (not .Values.mcp.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fulfillment-execution.mcpSecretName" . }}
  labels:
    {{- include "fulfillment-execution.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
type: Opaque
stringData:
  # Static bearer keys for the MCP server (ADR-0008). An empty value is
  # ignored by the binary, so leaving readWriteKey blank simply means no
  # read-write key exists; leaving BOTH blank makes the server reject every
  # request (fail closed).
  MCP_READ_KEY: {{ .Values.mcp.readKey | quote }}
  MCP_READWRITE_KEY: {{ .Values.mcp.readWriteKey | quote }}
{{- end }}
